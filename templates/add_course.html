<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <h1>Add New Course</h1>

    <form method="POST">

        <label>Course Title</label>

        <input
            type="text"
            name="title"
            required>

        <label>Description</label>

        <textarea
            name="description"
            rows="5"
            required></textarea>

        <label>Image Filename</label>

        <input
            type="text"
            name="image"
            placeholder="marketing.png">

        <button type="submit">
            Save Course
        </button>

    </form>

</div>

</body>
</html>
