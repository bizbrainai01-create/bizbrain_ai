<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Courses | BizBrain AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <img src="{{ url_for('static', filename='images/logo.png') }}">

            <h2>BizBrain AI</h2>

        </div>

        <ul class="menu">

            <li><a href="/dashboard"><i class="bi bi-house-fill"></i> Dashboard</a></li>

            <li><a class="active" href="/courses"><i class="bi bi-book-fill"></i> Courses</a></li>

            <li><a href="/notes"><i class="bi bi-journal-text"></i> Notes</a></li>

            <li><a href="/videos"><i class="bi bi-play-circle-fill"></i> Videos</a></li>

            <li><a href="/ai-tutor"><i class="bi bi-robot"></i> AI Tutor</a></li>

            <li><a href="/logout"><i class="bi bi-box-arrow-left"></i> Logout</a></li>

        </ul>

    </aside>

    <main class="main">

        <h1>Business Studies Courses</h1>

        <p>Select a course to begin learning.</p>

        <div class="cards">

            {% for course in courses %}

            <a href="/course/{{ course.id }}" class="card">

                <h1>{{ course.icon }}</h1>

                <h3>{{ course.title }}</h3>

                <p>{{ course.lessons }} Lessons</p>

                <button class="course-btn">
                    Start Learning →
                </button>

            </a>

            {% endfor %}

        </div>

    </main>

</div>

</body>

</html>
