{% extends "admin/layout.html" %}

{% block content %}

<div class="form-container">

<h1>Add Lesson</h1>

<form method="POST">

<input
type="text"
name="title"
placeholder="Lesson Title"
required>

<br><br>

<textarea
name="summary"
placeholder="Lesson Summary"
rows="8"></textarea>

<br><br>

<input
type="number"
name="lesson_number"
placeholder="Lesson Number"
required>

<br><br>

<select name="course_id" required>

<option value="">Select Course</option>

{% for course in courses %}

<option value="{{ course.id }}">

{{ course.title }}

</option>

{% endfor %}

</select>

<br><br>

<button type="submit">

Save Lesson

</button>

</form>

</div>

{% endblock %}
