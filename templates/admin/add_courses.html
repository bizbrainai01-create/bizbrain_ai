<h1>Add New Course</h1>

<form method="POST">

    <input
        type="text"
        name="title"
        placeholder="Course Title"
        required>

    <br><br>

    <textarea
        name="description"
        rows="6"
        placeholder="Course Description"></textarea>

    <br><br>

    <button type="submit">
        Add Course
    </button>

</form>
