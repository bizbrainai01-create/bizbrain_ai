{% extends "admin/layout.html" %}

{% block content %}

<div class="form-container">

    <h1>Add Course</h1>

    <form method="POST">

        <input
            type="text"
            name="title"
            placeholder="Course Title"
            required>

        <textarea
            name="description"
            placeholder="Description"
            required></textarea>

        <button type="submit">
            Save Course
        </button>

    </form>

</div>

{% endblock %}
