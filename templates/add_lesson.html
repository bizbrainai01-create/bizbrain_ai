<!DOCTYPE html>
<html>
<head>
    <title>Add Lesson</title>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f5f7fb;
            padding:40px;
        }

        .container{
            width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        input, textarea, select{
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:20px;
            border:1px solid #ddd;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            background:#16324F;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0f2337;
        }

        h1{
            color:#16324F;
        }

        label{
            font-weight:bold;
        }
    </style>

</head>
<body>

<div class="container">

<h1>Add New Lesson</h1>

<form method="POST" enctype="multipart/form-data">

    <label>Lesson Title</label>

    <input
        type="text"
        name="title"
        required>

    <label>Lesson Number</label>

    <input
        type="number"
        name="lesson_number"
        required>

    <label>Course</label>

    <select name="course_id" required>

        {% for course in courses %}

        <option value="{{ course.id }}">
            {{ course.title }}
        </option>

        {% endfor %}

    </select>

    <label>Lesson Summary</label>

    <textarea
        name="summary"
        rows="6"></textarea>

    <label>Upload Video (MP4)</label>

    <input
        type="file"
        name="video"
        accept="video/mp4">

    <label>Upload Notes (PDF)</label>

    <input
        type="file"
        name="notes"
        accept=".pdf,.doc,.docx,.ppt,.pptx">

    <button type="submit">

        Upload Lesson

    </button>

</form>

</div>

</body>
</html>
